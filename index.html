<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebGazer + Radar (p5)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://webgazer.cs.brown.edu/webgazer.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html,body { margin: 0; height: 100%; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background: #ffdc00; color: #000; }
    /* Top bar height is measured in JS (--topbar) so the canvas always starts right below it */
    #controls {
      position: fixed; left: 0; top: 0; right: 0; box-sizing: border-box;
      padding: 10px 16px 8px; background: #ffdc00; border-bottom: 3px solid #000; z-index: 30000;
    }
    #controls .btnrow { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 8px; }
    button {
      font: 500 clamp(11px, 1.45vw, 18px)/1 'JetBrains Mono', monospace; background: transparent; color: #000;
      border: 2px solid #000; border-radius: 0; padding: .55em .8em; margin: 0;
      white-space: nowrap; cursor: pointer;
    }
    button:hover { background: #000; color: #ffdc00; }
    #startGaze { background: #000; color: #ffdc00; }
    #info { font: 700 clamp(13px, 1.6vw, 21px)/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000; }
    #calibStatus { font: 400 clamp(11px, 1.4vw, 17px)/1.4 'JetBrains Mono', monospace; background: #000; padding: 1px 8px; }
    #calibStatus:empty { display: none; }
    #storageDebug { font: 400 11px/1.3 'JetBrains Mono', monospace; color: rgba(0,0,0,.55) !important; }

    canvas { display: block; z-index: 100 !important; position: absolute !important; background: transparent; pointer-events: none; }
    canvas#defaultCanvas0 { top: var(--topbar, 130px) !important; left: 0 !important; }

    #webgazerVideoContainer,
    video#webgazerVideoFeed,
    canvas#webgazerFaceOverlay,
    canvas#webgazerPredictionPoints {
      position: absolute !important;
      z-index: 1000 !important;
      object-fit: cover;
      pointer-events: none;
      display: block !important;
      visibility: visible !important;
    }

    /* Keep the camera + face mesh unfiltered: the yellow sepia filters made the mesh blend into the video */
    video#webgazerVideoFeed {
      opacity: 0.6 !important;
      filter: none !important;
    }

    canvas#webgazerFaceOverlay {
      opacity: 1 !important;
      filter: grayscale(1) brightness(2.2) contrast(1.2) !important;
      z-index: 1100 !important;
      pointer-events: none !important;
    }

    #webgazerPredictionPoints,
    #webgazerPredictionPoints *,
    .webgazerPredictionPoint,
    .predictionPoint {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    #webgazerFaceFeedbackBox,
    .webgazerFaceFeedbackBox {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="btnrow">
      <button id="startGaze">Start Gaze</button>
      <button id="calibrate" style="display:none;">Calibrate</button>
      <button id="resetCalibration" style="display:none;">Reset Calibration</button>
      <button id="pauseRobot" style="display:none;">Pause Robot (Calibration Mode)</button>
    </div>
    <span id="info">WS: disconnected</span>
    <span id="calibStatus" style="margin-left: 10px; color: #ffdc00;"></span>
    <div id="storageDebug" style="margin-top:6px; color:#ccc; font-size:10px;"></div>
  </div>

  <script>
    const WS_ADDR = 'ws://localhost:8765';
    let ws;
    let robotPaused = false;

    let robotState = "WAITING_APPROACH";
    let gazeFollowCount = 0;
    
    function connectWS() {
      ws = new WebSocket(WS_ADDR);
      ws.onopen = () => { 
        document.getElementById('info').textContent = 'WS: open';
        document.getElementById('pauseRobot').style.display = 'inline-block';
        console.log('✓ WebSocket connected to', WS_ADDR);
      };
      ws.onclose = () => { 
        document.getElementById('info').textContent = 'WS: closed'; 
        console.log('WebSocket closed, reconnecting...');
        setTimeout(connectWS,1000); 
      };
      ws.onerror = (e) => console.warn('WS error', e);
      ws.onmessage = ev => { 
        try { 
          const m = JSON.parse(ev.data); 
          if (m.type === 'radar') {
            window._lastRadarLine = m.data;
          } else if (m.type === 'state') {
            robotState = m.data;
            console.log('Robot state changed to:', robotState);
          } else if (m.type === 'gazeFollowCount') {
            gazeFollowCount = m.data;
            console.log('Gaze follow count:', gazeFollowCount);
          }
        } catch(e){
          console.error('Error parsing WebSocket message:', e);
        } 
      };
    }
    connectWS();

    document.getElementById('pauseRobot').addEventListener('click', () => {
      robotPaused = !robotPaused;
      const btn = document.getElementById('pauseRobot');
      
      if (robotPaused) {
        btn.textContent = 'Resume Robot';
        btn.style.background = '#ff6600';
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'control', data: 'PAUSE' }));
        }
      } else {
        btn.textContent = 'Pause Robot (Calibration Mode)';
        btn.style.background = '';
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'control', data: 'RESUME' }));
        }
      }
    });

    let gazeLatest = null;
    let gazeRawX = 0, gazeRawY = 0;
    let gazeH = "Center", gazeV = "Center";
    let gazeTrail = [];
    const GAZE_TRAIL_MAX = 60;
    
    let gazeMatrix = {
      'Left_Up': 0, 'Center_Up': 0, 'Right_Up': 0,
      'Left_Center': 0, 'Center_Center': 0, 'Right_Center': 0,
      'Left_Down': 0, 'Center_Down': 0, 'Right_Down': 0
    };
    
    function checkCalibrationStatus() {
      const calibStatusEl = document.getElementById('calibStatus');
      const regressionList = webgazer.getRegression();
      const regression = Array.isArray(regressionList) ? regressionList[0] : regressionList;
      const regressionHasData = regression && regression.getData && regression.getData().length > 0;

      if (regressionHasData) {
        calibStatusEl.textContent = '✓ Calibration ready';
        calibStatusEl.style.color = '#00ff00';
        return true;
      } else {
        calibStatusEl.textContent = 'No calibration';
        calibStatusEl.style.color = '#ff6600';
        return false;
      }
    }

    async function startWebGazer() {
      console.log('startWebGazer origin:', window.location.origin, window.location.href);
      console.log('localStorage support:', typeof localStorage !== 'undefined');
      webgazer.setRegression('ridge');
      webgazer.saveDataAcrossSessions(true);
      webgazer.showVideo(true);
      webgazer.showFaceOverlay(true);
      webgazer.showPredictionPoints(false);
      webgazer.showFaceFeedbackBox(false);
      webgazer.setGazeListener((data,ts)=>{
        if(!data) return;
        gazeRawX = data.x;
        gazeRawY = data.y;
        gazeLatest = {x:data.x,y:data.y,ts};
        updateGazeDirs();
        gazeTrail.push({x: data.x, y: data.y, ts});
        if (gazeTrail.length > GAZE_TRAIL_MAX) gazeTrail.shift();
      });
      
      // Suppress WebGazer HTTPS warning
      const originalAlert = window.alert;
      window.alert = function(message) {
        if (!message.includes('WebGazer works only over https')) {
          originalAlert(message);
        }
      };
      
      await webgazer.begin();
      
      // Restore alert function
      window.alert = originalAlert;
      webgazer.showPredictionPoints(false);
      
      // Load calibration from file if exists
      fetch('./calibration.json')
        .then(r => r.json())
        .then(data => {
          const regressionList = webgazer.getRegression();
          const regression = Array.isArray(regressionList) ? regressionList[0] : regressionList;
          if (regression && regression.setData) {
            regression.setData(data);
            console.log('Loaded calibration from calibration.json');
            setTimeout(checkCalibrationStatus, 100);
          }
        })
        .catch(e => {
          console.log('No calibration.json found, starting with fresh calibration');
        });
      
      const debugEl = document.getElementById('storageDebug');
      if (debugEl) {
        debugEl.textContent = `origin=${window.location.origin} WebGazer auto-persistence enabled`;
      }
      
      setTimeout(checkCalibrationStatus, 500);
      
      positionWebgazerElements();
      document.getElementById('calibrate').style.display = 'inline-block';
      document.getElementById('resetCalibration').style.display = 'inline-block';
    }
    
    document.getElementById('startGaze').addEventListener('click', async ()=> {
      try { 
        await startWebGazer(); 
        document.getElementById('startGaze').textContent = 'Gaze started';
      } catch(e){ 
        console.error(e); 
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('startGaze').click();
      }, 500);
    });
    
    window.addEventListener('resize', () => positionWebgazerElements());

    // ---- Auto refresh: reload the page every 30 min to recover a frozen camera.
    // Waits until the robot is idle (WAITING_APPROACH), not paused and not calibrating,
    // so a visitor's interaction is never cut off. Calibration reloads from calibration.json.
    const AUTO_REFRESH_MS = 30 * 60 * 1000;
    const pageLoadedAt = Date.now();
    setInterval(() => {
      if (Date.now() - pageLoadedAt < AUTO_REFRESH_MS) return;
      if (robotPaused) return;
      if (robotState !== 'WAITING_APPROACH') return;
      if (document.getElementById('calibrationDot')) return;
      console.log('Auto refresh: reloading page');
      location.reload();
    }, 5000);

    // ---- Layout: the canvas is drawn in a virtual space (at least DESIGN_W x DESIGN_H)
    // and scaled to fit the screen, so it looks the same on any resolution / Windows scaling.
    const DESIGN_W = 1080, DESIGN_H = 1700;
    const GAZE_RATIO = 0.29, RADAR_RATIO = 0.16;   // decision tree gets the rest
    const INFO_RATIO = 0.26;                        // width of the left info column
    const TITLE_H = 60;                             // black title bars

    function getLayout() {
      const controls = document.getElementById('controls');
      const topbar = controls ? controls.offsetHeight : 0;
      const sw = window.innerWidth, sh = Math.max(1, window.innerHeight - topbar);
      const S = Math.min(sw / DESIGN_W, sh / DESIGN_H);
      const W = sw / S, H = sh / S;
      const gazeH = H * GAZE_RATIO, radarH = H * RADAR_RATIO;
      const infoW = W * INFO_RATIO;
      return { topbar, sw, sh, S, W, H, gazeH, radarH, decisionH: H - gazeH - radarH, infoW, plateX: infoW + 20 };
    }

    function positionWebgazerElements() {
      let tries = 0, maxTries = 30;
      const attempt = () => {
        tries++;
        const L = getLayout();
        const plateX = Math.round(L.plateX * L.S);
        const plateY = Math.round(L.topbar + TITLE_H * L.S);
        const plateW = window.innerWidth - plateX;
        const h = Math.floor((L.gazeH - TITLE_H) * L.S);
        const video = document.getElementById('webgazerVideoFeed') || document.querySelector('video');
        // No querySelector('canvas') fallback: before WebGazer starts that would grab the p5 canvas and shrink it
        const face = document.getElementById('webgazerFaceOverlay');
        const pred = document.getElementById('webgazerPredictionPoints');

        if (video) {
          try { video.autoplay = true; video.playsInline = true; video.muted = true; } catch(e){}
          video.style.left=plateX+'px'; video.style.top=plateY+'px';
          video.style.width = plateW + 'px'; video.style.height = h + 'px';
          video.style.objectFit = 'cover'; video.style.opacity = '0.6';
          video.style.zIndex = '1000'; video.style.display='block'; video.style.visibility='visible';
        }
        
        if (face) {
          face.style.left=plateX+'px'; face.style.top=plateY+'px';
          face.style.width = plateW + 'px'; face.style.height = h + 'px';
          face.style.zIndex='1100'; face.style.pointerEvents='none'; 
          face.style.display='block'; face.style.visibility='visible';
        }
        
        if (pred) {
          pred.style.display='block'; pred.style.visibility='visible'; pred.style.opacity='1';
        }

        const feedbackBox = document.getElementById('webgazerFaceFeedbackBox') || document.querySelector('.webgazerFaceFeedbackBox');
        if (feedbackBox) {
          feedbackBox.style.display='none'; feedbackBox.style.visibility='hidden'; feedbackBox.style.opacity='0';
        }

        if ((video && face) || tries>=maxTries) return;
        setTimeout(attempt, 200);
      };
      attempt();
    }

    function saveCalibration() {
      try {
        console.log('saveCalibration() called');
        const regressionList = webgazer.getRegression();
        const regression = Array.isArray(regressionList) ? regressionList[0] : regressionList;
        console.log('regression object:', regression);
        if (regression && regression.getData) {
          const data = regression.getData();
          console.log('regression data length:', data && data.length);
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'saveCalibration', data: data }));
            console.log('Calibration data sent to server for saving');
          } else {
            console.warn('WebSocket not connected, cannot save calibration');
          }
          setTimeout(() => {
            document.getElementById('calibStatus').textContent = '✓ Calibration saved';
            document.getElementById('calibStatus').style.color = '#00ff00';
          }, 100);
        } else {
          console.warn('saveCalibration skipped: regression unavailable or no getData', regression);
        }
      } catch(e) {
        console.error('Failed to save calibration:', e);
      }
    }

    async function clearWebgazerStorage() {
      localStorage.removeItem('webgazerCalibrationData');
      if (window.localforage) {
        try {
          await localforage.removeItem('webgazerGlobalData');
          await localforage.removeItem('webgazerGlobalSettings');
          console.log('✓ WebGazer IndexedDB storage cleared');
        } catch (e) {
          console.warn('Could not clear WebGazer storage:', e);
        }
      }
    }

    document.getElementById('calibrate').addEventListener('click', () => {
      console.log('Calibration started');
      const pts = [
        {x:0.1, y:0.1}, {x:0.5, y:0.1}, {x:0.9, y:0.1},
        {x:0.1, y:0.5}, {x:0.4, y:0.5}, {x:0.5, y:0.5}, {x:0.6, y:0.5}, {x:0.9, y:0.5},
        {x:0.1, y:0.9}, {x:0.5, y:0.9}, {x:0.9, y:0.9},
        {x:0.5, y:0.3}, {x:0.5, y:0.7}
      ];
      let i = 0;
      let clickCount = 0;
      const CLICKS_PER_POINT = 5;
      
      const dot = document.createElement('div');
      dot.id = 'calibrationDot';
      dot.style.cssText = 'position:fixed; width:40px; height:40px; background:#000; border:5px solid #ffdc00; border-radius:50%; z-index:40000; cursor:pointer; box-shadow: 0 0 0 3px #000; transition: transform 0.2s;';
      document.body.appendChild(dot);

      const instruction = document.createElement('div');
      instruction.id = 'calibInstruction';
      instruction.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#000; color:#ffdc00; padding:26px 44px; z-index:39999; font-size:22px; line-height:1.4; text-align:center; pointer-events:none; font-family: JetBrains Mono, monospace;';
      instruction.innerHTML = 'Click each yellow dot 5 times<br>while looking at it<br><span style="font-size:17px; color:#ffdc00;">(Extra center points for better accuracy)</span>';
      document.body.appendChild(instruction);

      setTimeout(() => { if (instruction.parentNode) instruction.remove(); }, 4000);

      function showNext() {
        if (i >= pts.length) {
          dot.remove();
          if (instruction.parentNode) instruction.remove();
          saveCalibration();
         // alert('Calibration complete and saved even after refreshing page.');
          return;
        }
        
        clickCount = 0;
        const p = pts[i];
        const cx = Math.round(p.x * window.innerWidth * 0.8);
        const cy = Math.round(p.y * window.innerHeight * 0.35);
        dot.style.left = (cx - 20) + 'px';
        dot.style.top = (cy - 20) + 'px';
        dot.style.transform = 'scale(1)';
        console.log(`Point ${i+1}/${pts.length} at (${cx}, ${cy})`);
      }

      dot.addEventListener('click', () => {
        const rect = dot.getBoundingClientRect();
        const cx = Math.round(rect.left + 20);
        const cy = Math.round(rect.top + 20);
        
        if (webgazer && webgazer.recordScreenPosition) {
          webgazer.recordScreenPosition(cx, cy);
          console.log(`Recorded point ${i+1}, click ${clickCount+1}/5`);
        }
        
        clickCount++;
        dot.style.transform = 'scale(1.2)';
        setTimeout(() => { dot.style.transform = 'scale(1)'; }, 150);
        
        // Save calibration state during calibration so it persists immediately
        saveCalibration();
        
        if (clickCount >= CLICKS_PER_POINT) {
          i++;
          setTimeout(showNext, 300);
        }
      });

      // ✓ FIX: Call showNext() to display the first dot!
      showNext();
    });

    document.getElementById('resetCalibration').addEventListener('click', async () => {
      // if (confirm('Are you sure you want to clear the saved calibration? You will need to calibrate again.')) {
      if (webgazer.getRegression()) { webgazer.clearData(); }
      await clearWebgazerStorage();
      document.getElementById('calibStatus').textContent = 'Calibration reset';
      document.getElementById('calibStatus').style.color = '#ff6600';
      // alert('Calibration cleared from storage. Please click "Calibrate" button to recalibrate.');
      // }
    });

    function updateGazeDirs() {
      const w = window.innerWidth; 
      const h = Math.floor(window.innerHeight * 0.35);
      if (!gazeLatest) return;
      let gx = Math.max(0, Math.min(w, gazeLatest.x));
      let gy = Math.max(0, Math.min(h, gazeLatest.y));
      const cx = w/2, cy = h/2; 
      const dx = gx-cx, dy = gy-cy; 
      const dead = 50;
      gazeH = Math.abs(dx)<=dead ? "Center" : (dx>0?"Right":"Left");
      gazeV = Math.abs(dy)<=dead ? "Center" : (dy>0?"Down":"Up");

      const state = `${gazeH}_${gazeV}`;
      if (gazeMatrix.hasOwnProperty(state)) {
        gazeMatrix[state]++;
      }

      try { recordGazeSample(); } catch(e) {}
    }

    let gazeConclusion = "No data";
    let gazeGlobalHistory = [];
    let gazeGlobalValue = "No data";
    const GAZE_ANALYSIS_MS = 500;
    const GLOBAL_ANALYSIS_MS = 120000;

    function recordGazeSample() {
      if (!gazeH || !gazeV) return;
      const state = `${gazeH}_${gazeV}`;
      gazeConclusion = mapGazeToConclusion(state);
    }

    function mostCommon(arr) {
      const counts = Object.create(null);
      let best = null, bestCount = 0;
      for (const v of arr) {
        counts[v] = (counts[v] || 0) + 1;
        if (counts[v] > bestCount) { best = v; bestCount = counts[v]; }
      }
      return best;
    }

    function mapGazeToConclusion(state) {
      if (state === 'Center_Center') return 'paying attention';
      if (state === 'Center_Up' || state === 'Center_Down') return 'paying attention';
      if (state === 'Left_Up' || state === 'Left_Down') return 'distracted left';
      if (state === 'Right_Up' || state === 'Right_Down') return 'distracted right';
      if (state === 'Center_Left') return 'another person left';
      if (state === 'Center_Right') return 'another person right';
      if (state === 'Left_Center') return 'another person left';
      if (state === 'Right_Center') return 'another person right';
      return 'paying attention';
    }

    setInterval(() => {
      if (robotPaused || !gazeConclusion || gazeConclusion === "No data") return;
      gazeGlobalHistory.push(gazeConclusion);
      if (ws && ws.readyState === 1 && !robotPaused) {
        ws.send(JSON.stringify({ type: 'gaze', data: gazeConclusion }));
        console.log('LIVE gaze:', gazeConclusion);
      }
      const info = document.getElementById('info');
      if (info) info.textContent = `WS: ${ws && ws.readyState===1 ? 'open':'closed'}; — Gaze (LIVE): ${gazeConclusion}`;
    }, GAZE_ANALYSIS_MS);

    setInterval(() => {
      if (gazeGlobalHistory.length === 0) return;
      gazeGlobalValue = mostCommon(gazeGlobalHistory);
      gazeGlobalHistory = [];
    }, GLOBAL_ANALYSIS_MS);

    let targetX=0,targetY=0,speed=0,acceleration=0;
    let filteredX=0,filteredY=0,prevFilteredY=0;
    let alpha=0.3;
    let positionTrail=[], speedTrail=[], yDirectionTrail=[];
    // Visual-only copy of the walking trail; never cleared by analyzeBehaviorLocal() so the dots don't blink
    let displayTrail=[];
    const maxTrailLength=10, movementThreshold=20;
    const STILL_THRESHOLD = 8;
    const FAST_SPEED = 25;
    const SLOW_SPEED = 15;
    
    let behaviorType="Initializing...";
    let movementStatus = "Unknown";
    let analysisCount=0;
    let behaviorGlobalHistory = [];
    let behaviorGlobalValue = "Initializing...";
    let currentZone = "Unknown";
    let currentDistanceCM = 0;   // shown next to the zone label so the thresholds can be checked
    window._lastRadarLine = null;

    
    let approachValence = "";

    // history of radar trail data (showing how and where someone has walked)
    let radarTrail = [];
    const RADAR_TRAIL_MAX = 15;

    setInterval(() => {
      if (behaviorGlobalHistory.length === 0) return;
      behaviorGlobalValue = mostCommon(behaviorGlobalHistory);
      behaviorGlobalHistory = [];
    }, GLOBAL_ANALYSIS_MS);

    // Proxemic zone thresholds in cm (Hall's zones). Tune these to the size of your space.
    const ZONE_INTIMATE_CM = 45;
    const ZONE_PERSONAL_CM = 100;
    const ZONE_SOCIAL_CM   = 200;
    function calculateZone(distanceMM) {
      const distanceCM = distanceMM / 10;
      if (distanceCM <= ZONE_INTIMATE_CM) return "Intimate";
      if (distanceCM <= ZONE_PERSONAL_CM) return "Personal";
      if (distanceCM <= ZONE_SOCIAL_CM) return "Social";
      return "Public";
    }

    new p5(p => {
      let w,h;   // virtual (unscaled) canvas size, see getLayout()

      p.setup = ()=>{
        const L = getLayout();
        p.createCanvas(L.sw, L.sh);
        p.textFont('Helvetica',16);
        p.frameRate(60);
      };

      // Checked every frame: handles window resize, fullscreen and the top bar changing height
      // (e.g. when the Pause button appears or the web fonts finish loading).
      let lastLayoutKey = '';
      function syncLayout() {
        const L = getLayout();
        const key = L.topbar + 'x' + L.sw + 'x' + L.sh;
        if (key !== lastLayoutKey) {
          lastLayoutKey = key;
          document.documentElement.style.setProperty('--topbar', L.topbar + 'px');
          if (p.width !== L.sw || p.height !== L.sh) p.resizeCanvas(L.sw, L.sh);
          positionWebgazerElements();
        }
        return L;
      }

      function computeMean(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; }

      function analyzeBehaviorLocal(){
        const N = positionTrail.length;
        if(N < 2) return;
        
        const avgSpeed = computeMean(speedTrail);
        const allSpeeds = speedTrail.filter(s => !isNaN(s));
        const stillCount = allSpeeds.filter(s => Math.abs(s) < STILL_THRESHOLD).length;
        const stillRatio = stillCount / allSpeeds.length;
        
        if (stillRatio > 0.7) {
          movementStatus = "Standing Still";
          behaviorType = "Standing Still";
          console.log('Person is standing still (speed ratio: ' + stillRatio.toFixed(2) + ')');
          positionTrail = []; speedTrail = []; yDirectionTrail = [];
          return;
        }
        
        movementStatus = "Moving";
        const first = positionTrail[0], last = positionTrail[N-1];
        const yChange = last.y - first.y;
        const towards = yChange < -30;
        const away = yChange > 30;
        
        let emotion = "Neutral";
        const speedVal = Math.abs(avgSpeed);
        
        if (towards) {
          if (speedVal > FAST_SPEED) {
            emotion = "Angry";
            console.log('ANGRY: Fast movement towards (speed: ' + speedVal.toFixed(1) + ', Y change: ' + yChange.toFixed(0) + ')');
          } else {
            emotion = "Curious";
            console.log('CURIOUS: Slow movement towards (speed: ' + speedVal.toFixed(1) + ', Y change: ' + yChange.toFixed(0) + ')');

        } else if (away) {

          } else {
            emotion = "Uncomfortable";
            console.log('UNCOMFORTABLE: Slow movement away (speed: ' + speedVal.toFixed(1) + ', Y change: ' + yChange.toFixed(0) + ')');
          }
        } else {
          // NEW: horizontal walking — label based on speed, keep for use in rejection later
          if (speedVal > FAST_SPEED) {

            console.log('ANGRY: Fast horizontal movement (speed: ' + speedVal.toFixed(1) + ', Y change: ' + yChange.toFixed(0) + ')');

            emotion = "Curious";
            console.log('CURIOUS: Slow horizontal movement (speed: ' + speedVal.toFixed(1) + ', Y change: ' + yChange.toFixed(0) + ')');
          }
        }

        behaviorType = emotion;
        behaviorGlobalHistory.push(emotion);

        // Only send to ESP32 if NOT already in react mode — label is stored for later use
        if (ws && ws.readyState === 1 && !robotPaused) {
          ws.send(JSON.stringify({ type: 'proxemics', data: behaviorType }));
          console.log('→ Browser sent proxemics:', behaviorType);
        }
        
        positionTrail = []; speedTrail = []; yDirectionTrail = [];
}

      function getActiveSensor() {
        if (robotState === "WAITING_APPROACH" || robotState === "CHECKING_MOVEMENT" 
            || robotState === "POSITION_FOLLOWING") {  // ADD THIS
          return "radar";
        } else if (robotState === "GAZE_FOLLOWING" || robotState === "SURPRISE_REACTION" 
                  || robotState === "REJECTION_HOLD") {
          return "gaze";
        }
        return "none";
      }

      function drawDecisionBox(x, y, w, h, label, color, isActive, content = []) {
        p.push();
        
        p.noStroke();
        p.fill(0, 0, 0, 20);
        p.rect(x + 3, y + 3, w, h, 8);
        
        p.stroke(isActive ? p.color(255, 220, 0) : p.color(100, 100, 100));
        p.strokeWeight(isActive ? 4 : 2);
        p.fill(isActive ? p.color(255, 220, 0, 40) : p.color(100, 100, 100));
        p.rect(x, y, w, h, 8);
        
        p.noStroke();
        p.fill(255, 220, 0);
        p.rect(x, y, w, 30, 8, 8, 0, 0);
        
        p.fill(0);
        p.textSize(13);
        p.textAlign(p.CENTER, p.CENTER);
        p.textStyle(p.BOLD);
        p.text(label, x + w/2, y + 13);
        p.textStyle(p.NORMAL);
        
        p.fill(255);
        p.textSize(11);
        let yOffset = y + 40;
        for (let line of content) {
          p.text(line, x + w/2, yOffset);
          yOffset += 16;
        }
        p.pop();
      }

      function drawDiamond(x, y, size, label, sublabel = "") {
        p.push();
        
        p.noStroke();
        p.fill(0, 0, 0, 20);
        p.translate(x + 2, y + 2);
        p.rotate(p.PI/4);
        p.rect(-size/2, -size/2, size, size, 4);
        p.pop();
        
        p.push();
        p.stroke(100, 100, 100);
        p.strokeWeight(2);
        p.fill(255, 250, 220);
        p.translate(x, y);
        p.rotate(p.PI/4);
        p.rect(-size/2, -size/2, size, size, 4);
        p.pop();
        
        p.fill(0);
        p.textSize(9);
        p.textAlign(p.CENTER, p.CENTER);
        p.textStyle(p.BOLD);
        p.text(label, x, y - 6);
        if (sublabel) {
          p.textStyle(p.NORMAL);
          p.textSize(8);
          p.text(sublabel, x, y + 6);
        }
        p.pop();
      }

      function drawArrow(x1, y1, x2, y2, label = "", curved = false) {
        p.push();
        p.stroke(100, 100, 100);
        p.strokeWeight(2);
        p.noFill();
        
        if (curved) {
          p.bezier(x1, y1, (x1 + x2)/2, y1 - 30, (x1 + x2)/2, y2 - 30, x2, y2);
        } else {
          p.line(x1, y1, x2, y2);
        }
        
        p.fill(100, 100, 100);
        p.noStroke();
        const angle = p.atan2(y2 - y1, x2 - x1);
        p.push();
        p.translate(x2, y2);
        p.rotate(angle);
        p.triangle(0, 0, -12, -6, -12, 6);
        p.pop();
        
        if (label) {
          p.fill(255);
          p.stroke(0);
          p.strokeWeight(3);
          p.textSize(9);
          p.textAlign(p.CENTER, p.CENTER);
          p.textStyle(p.BOLD);
          const midX = (x1 + x2) / 2;
          const midY = curved ? ((y1 + y2) / 2) - 20 : (y1 + y2) / 2;
          p.text(label, midX, midY - 10);
        }
        p.pop();
      }

      // Sets the text size to `size`, shrinking it if `str` would be wider than maxW (call after textFont/textStyle)
      function fitTextSize(str, maxW, size) {
        p.textSize(size);
        const tw = p.textWidth(str);
        if (tw > maxW) p.textSize(Math.max(8, size * maxW / tw));
      }

      function drawTitleBar(x, y, bw, title, rightText) {
        p.push();
        p.noStroke(); p.fill(0); p.rect(x, y, bw, TITLE_H);
        if (rightText) {
          p.fill(255, 220, 0, 170);
          p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL); p.textSize(14);
          p.textAlign(p.RIGHT, p.CENTER);
          p.text(rightText, x + bw - 24, y + TITLE_H / 2);
        }
        p.fill(255, 220, 0);
        p.textFont('Helvetica'); p.textStyle(p.BOLD);
        p.drawingContext.letterSpacing = '-1px';
        fitTextSize(title, bw - 64, 40);
        p.textAlign(p.LEFT, p.CENTER);
        p.text(title, x + 24, y + TITLE_H / 2 + 2);
        p.drawingContext.letterSpacing = '0px';
        p.pop();
      }

      const TREE_LEGEND_H = 22;
      // 1c layout: group label | divider + sub-labels | interpretation boxes
      function drawTreeGroups(x0, y0, groups, rowH, rowGap, groupGap, legend) {
        const cDiv = x0 + 150, cV = cDiv + 14, cBox = cDiv + 150, boxW = w - 24 - cBox;
        const vSize = Math.min(17, rowH * 0.62), cSize = Math.min(20, rowH * 0.7);
        p.push();
        p.noStroke(); p.fill(0, 0, 0, 153);
        p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL); p.textSize(13);
        p.textAlign(p.LEFT, p.TOP);
        p.text(legend[0], x0, y0); p.text(legend[1], cDiv, y0); p.text(legend[2], cBox, y0);
        let y = y0 + TREE_LEGEND_H;
        for (const g of groups) {
          const n = g.rows.length, gh = n * rowH + (n - 1) * rowGap;
          p.noStroke(); p.fill(0);
          p.textFont('Helvetica'); p.textStyle(p.BOLD);
          fitTextSize(g.h, cDiv - x0 - 10, Math.min(22, gh * 0.8));
          p.textAlign(p.LEFT, p.CENTER);
          p.text(g.h, x0, y + gh / 2);
          p.stroke(0); p.strokeWeight(3); p.strokeCap(p.SQUARE);
          p.line(cDiv + 1.5, y, cDiv + 1.5, y + gh);
          g.rows.forEach((r, i) => {
            const ry = y + i * (rowH + rowGap), cy = ry + rowH / 2;
            p.noStroke(); p.fill(0, 0, 0, r.vAct ? 255 : 128);
            p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL); p.textSize(vSize);
            p.text(r.v, cV, cy);
            if (r.cAct) { p.noStroke(); p.fill(0); } else { p.noFill(); p.stroke(0, 0, 0, 82); p.strokeWeight(2); }
            p.rect(cBox + 1, ry + 1, boxW - 2, rowH - 2);
            p.noStroke(); p.fill(r.cAct ? p.color(255, 220, 0) : p.color(0));
            p.textFont('Helvetica'); p.textStyle(p.BOLD);
            fitTextSize(r.c, boxW - 32, cSize);
            p.text(r.c, cBox + 14, cy + 1);
          });
          y += gh + groupGap;
        }
        p.pop();
      }

      function drawDecisionTree(top, D) {
        // Row height is derived from the space left after the Action section,
        // so the three sections always fit without overlapping.
        const PAD = 10, rowGap = 3, groupGap = 10;
        const ACTION_MIN_H = 230;
        const fixedH = 3 * TITLE_H + ACTION_MIN_H
          + 2 * (2 * PAD + TREE_LEGEND_H)
          + (6 * rowGap + 2 * groupGap)    // gaze: 9 rows in 3 groups
          + (2 * rowGap + 2 * groupGap);   // walking: 5 rows in 3 groups
        const rowH = Math.max(18, Math.min(36, (D - fixedH) / 14));
        const gazeSecH = TITLE_H + 2 * PAD + TREE_LEGEND_H + 9 * rowH + 6 * rowGap + 2 * groupGap;
        const walkSecH = TITLE_H + 2 * PAD + TREE_LEGEND_H + 5 * rowH + 2 * rowGap + 2 * groupGap;
        const actSecH = D - gazeSecH - walkSecH;
        p.push();

        // gaze interpretation
        const gy = top;
        drawTitleBar(0, gy, w, "Interpretation of Human Gaze");
        const G = (hn, map) => ({
          h: hn,
          rows: ['Up', 'Center', 'Down'].map(vn => ({
            v: vn, vAct: gazeH === hn && gazeV === vn,
            // only highlight the row being looked at (several rows share one conclusion)
            c: map[vn][0], cAct: gazeH === hn && gazeV === vn && gazeConclusion === map[vn][1]
          }))
        });
        // Display text only — the conclusions sent to the ESP32 ('distracted left/right') are unchanged
        const TL = ['Thinking?', 'distracted left'];
        const BL = ['Bored', 'distracted left'];
        const TR = ['Thinking?', 'distracted right'];
        const BR = ['Bored', 'distracted right'];
        const PA = ['Paying Attention', 'paying attention'];
        // Display text only — still matches the 'paying attention' conclusion sent to the ESP32
        const PPA = ['Pretending to pay attention', 'paying attention'];
        const gazeGroups = [
          G('Left', { Up: TL, Center: ['Another person on their left?', 'another person left'], Down: BL }),
          G('Center', { Up: PPA, Center: PA, Down: PPA }),
          G('Right', { Up: TR, Center: ['Another person on their right?', 'another person right'], Down: BR })
        ];
        drawTreeGroups(24, gy + TITLE_H + PAD, gazeGroups, rowH, rowGap, groupGap, ['Horizontal', 'Vertical Direction', 'Interpretation']);

        // walking interpretation
        const wy = top + gazeSecH;
        drawTitleBar(0, wy, w, "Interpretation of Human Walking");
        const isStill = movementStatus === "Standing Still";
        const isForward = !isStill && speed < 0;
        const isAway = !isStill && speed > 0;
        const slow = Math.abs(speed) <= SLOW_SPEED, fast = Math.abs(speed) > FAST_SPEED;
        const walkGroups = [
          { h: 'Still', rows: [{ v: 'None', vAct: isStill, c: 'Nervous', cAct: behaviorType === 'Standing Still' }] },
          { h: 'Forward', rows: [
            { v: 'Slow', vAct: isForward && slow, c: 'Curious', cAct: behaviorType === 'Curious' },
            { v: 'Fast', vAct: isForward && fast, c: 'Angry', cAct: behaviorType === 'Angry' }] },
          { h: 'Away', rows: [
            { v: 'Slow', vAct: isAway && slow, c: 'Uncomfortable', cAct: behaviorType === 'Uncomfortable' },
            { v: 'Fast', vAct: isAway && fast, c: 'Scared', cAct: behaviorType === 'Scared' }] }
        ];
        drawTreeGroups(24, wy + TITLE_H + PAD, walkGroups, rowH, rowGap, groupGap, ['Direction', 'Accel.', 'Interpretation']);

        // action: five states left to right (privacy note sits in the title bar)
        const ay = top + gazeSecH + walkSecH;
        drawTitleBar(0, ay, w, "Action", "Privacy: no images are stored. Run locally.");
        const states = [
          // Labels only; the robotState values come from the ESP32 and are unchanged
          { name: 'WAITING', d: ['Radar active', 'Detect approach'], on: robotState === 'WAITING_APPROACH' },
          { name: 'RADAR FOLLOW', d: ['Radar active', 'Follow position'], on: robotState === 'POSITION_FOLLOWING' },
          { name: 'GAZE FOLLOW', d: [gazeFollowCount + '/10', gazeFollowCount < 5 ? 'Slow' : 'Fast'], on: robotState === 'GAZE_FOLLOWING' },
          { name: 'SURPRISE', d: ['Fast shake', '3x ±40°'], on: robotState === 'SURPRISE_REACTION' }
        ];
        const n = states.length;
        const gap = 12, cx0 = 24, cw = (w - 48 - gap * (n - 1)) / n;
        const cy0 = ay + TITLE_H + 14;
        const loopsH = 44;
        const ch = Math.max(80, Math.min(160, actSecH - TITLE_H - 14 - loopsH - 8));
        const pad = 12;
        states.forEach((s, i) => {
          const x = cx0 + i * (cw + gap);
          if (s.on) { p.noStroke(); p.fill(0); } else { p.noFill(); p.stroke(0, 0, 0, 82); p.strokeWeight(2); }
          p.rect(x + 1, cy0 + 1, cw - 2, ch - 2);
          p.noStroke(); p.fill(s.on ? p.color(255, 220, 0) : p.color(0));
          p.textFont('Helvetica'); p.textStyle(p.BOLD);
          fitTextSize(s.name, cw - 2 * pad, 20);
          p.textAlign(p.LEFT, p.TOP);
          p.text(s.name, x + pad, cy0 + pad);
          p.fill(s.on ? p.color(255, 220, 0, 184) : p.color(0, 0, 0, 153));
          p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL);
          fitTextSize(s.d[0].length > s.d[1].length ? s.d[0] : s.d[1], cw - 2 * pad, 14);
          p.textAlign(p.LEFT, p.BOTTOM);
          p.text(s.d[0], x + pad, cy0 + ch - pad - 18);
          p.text(s.d[1], x + pad, cy0 + ch - pad);
        });

        // loops back from SURPRISE (last card): green to GAZE FOLLOW, red to WAITING
        const cc = i => cx0 + i * (cw + gap) + cw / 2;
        const by = cy0 + ch + 6;
        const loop = (x1, x2, ly, col) => {
          p.noFill(); p.stroke(col); p.strokeWeight(3); p.strokeCap(p.SQUARE);
          p.line(x1, by, x1, ly); p.line(x1, ly, x2, ly); p.line(x2, ly, x2, by + 10);
          p.noStroke(); p.fill(col); p.triangle(x2, by, x2 - 6, by + 11, x2 + 6, by + 11);
        };
        loop(cc(n - 1) - 30, cc(2), by + 18, p.color(0, 110, 0));
        loop(cc(n - 1) + 30, cc(0), by + 34, p.color(170, 0, 0));

        p.pop();
      }

      p.draw = () => {
        const LAY = syncLayout();
        p.clear();
        // Everything below is drawn in virtual units and scaled to the real canvas
        p.push();
        p.scale(LAY.S);
        w = LAY.W;
        h = LAY.H;

        const gazeHeight = LAY.gazeH;
        const radarHeight = LAY.radarH;
        const decisionHeight = LAY.decisionH;

        const infoBoxW = LAY.infoW;
        const gazeVisW = w - infoBoxW - 20;
        
        const activeSensor = getActiveSensor();

        // gaze camera stream

        p.push();
        const BAR = TITLE_H;
        p.fill(0);
        p.noStroke();
        p.rect(0, 0, w, gazeHeight);
        p.fill(255, 220, 0);
        p.rect(0, BAR, infoBoxW, gazeHeight - BAR);
        drawTitleBar(0, 0, w, "Raw Gaze");
        
        if (activeSensor === "gaze") {
          p.stroke(255, 220, 0);
          p.strokeWeight(6);
          p.noFill();
          p.rect(3, 3, w - 6, gazeHeight - 6);
        }
        
        // left info column: small mono label + big value, stacked
        p.noStroke(); p.textAlign(p.LEFT, p.TOP);
        const infoInner = infoBoxW - 40;
        const infoRow = (label, value, y, size) => {
          p.fill(0, 0, 0, 150); p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL); p.textSize(14);
          p.text(label, 20, y);
          p.fill(0); p.textFont('Helvetica'); p.textStyle(p.BOLD);
          fitTextSize(value, infoInner, size);
          p.text(value, 20, y + 18);
        };
        p.fill(0, 0, 0, 150); p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL);
        fitTextSize("Raw Data of Gaze", infoInner, 14);
        p.text("Raw Data of Gaze", 20, BAR + 14);
        infoRow("X:", gazeRawX.toFixed(0), BAR + 46, 60);
        infoRow("Y:", gazeRawY.toFixed(0), BAR + 136, 60);
        infoRow("H:", gazeH, BAR + 226, 30);
        infoRow("V:", gazeV, BAR + 290, 30);
        p.textStyle(p.NORMAL);
        p.stroke(0); p.strokeWeight(3); p.line(infoBoxW, BAR, infoBoxW, gazeHeight); p.noStroke();
        
        const gazeVisX = infoBoxW + 20;
        p.noFill();
        
        if (gazeTrail && gazeTrail.length > 0) {
          const L = gazeTrail.length;
          for (let i=0;i<L;i++){
            const g = gazeTrail[i];
            const px = p.constrain(g.x / LAY.S + gazeVisX, gazeVisX, w);
            const py = p.constrain(g.y / LAY.S, 0, gazeHeight - BAR - 8) + BAR + 4;
            const alpha = p.map(i, 0, L-1, 60, 255);
            p.noStroke(); p.fill(255, 220, 0, alpha);
            const sz = p.map(i, 0, L-1, 4, 12);
            p.ellipse(px, py, sz, sz);
          }
        }

        if(gazeLatest){
          const gx = p.constrain(gazeLatest.x / LAY.S + gazeVisX, gazeVisX, w);
          const gy = p.constrain(gazeLatest.y / LAY.S, 0, gazeHeight - BAR - 8) + BAR + 4;
          const cx = gazeVisX + gazeVisW/2, cy = (gazeHeight + BAR)/2;
          p.stroke(255); p.strokeWeight(2); 
          p.line(cx-10,cy,cx+10,cy); p.line(cx,cy-10,cx,cy+10);
          p.stroke(255,220,0); p.strokeWeight(3); p.line(cx,cy,gx,gy);
          const angle = Math.atan2(gy-cy,gx-cx); const head = 12;
          p.push(); p.translate(gx,gy); p.rotate(angle); p.noStroke(); 
          p.fill(255,220,0); p.triangle(0,0,-head,head/2,-head,-head/2); 
          p.pop();
        }
        
        const gridSize = 140;
        const cell = 36;
        const gridX = w - gridSize - 16;
        const gridY = gazeHeight - gridSize - 16;
        p.push();
        p.noStroke();
        p.fill(255, 220, 0);
        p.textFont('Helvetica'); p.textStyle(p.BOLD); p.textSize(20);
        p.textAlign(p.LEFT,p.TOP);
        p.text("Gaze matrix", gridX, gridY - 40);
        p.textStyle(p.NORMAL); p.textFont('JetBrains Mono'); p.textSize(12);
        const horizMap = { "Left":0, "Center":1, "Right":2 };
        const vertMap = { "Up":0, "Center":1, "Down":2 };
        const colIdx = horizMap[gazeH] !== undefined ? horizMap[gazeH] : 1;
        const rowIdx = vertMap[gazeV] !== undefined ? vertMap[gazeV] : 1;
        for(let r=0;r<3;r++){
          for(let c=0;c<3;c++){
            const x = gridX + c*(cell+6);
            const y = gridY + r*(cell+6);
            if(r===rowIdx && c===colIdx){
              p.fill(255, 220, 0);
              p.noStroke();
              p.rect(x,y,cell,cell,4);
            } else {
              p.noFill();
              p.stroke(255, 220, 0, 110);
              p.strokeWeight(2);
              p.rect(x,y,cell,cell,4);
            }
          }
        }
        // column labels centred on each column, row labels right-aligned left of the grid
        p.noStroke(); p.fill(255, 220, 0); p.textSize(10);
        p.textAlign(p.CENTER,p.BOTTOM);
        ["Left", "Center", "Right"].forEach((t, c) => p.text(t, gridX + c*(cell+6) + cell/2, gridY - 5));
        p.textAlign(p.RIGHT,p.CENTER);
        ["Up", "Center", "Down"].forEach((t, r) => p.text(t, gridX - 6, gridY + r*(cell+6) + cell/2));
        p.pop();
        
        p.pop();

        // radar visualization

        p.push();
        p.translate(0, gazeHeight);
        p.fill(255, 220, 0);
        p.noStroke();
        p.rect(0, 0, w, radarHeight);
        drawTitleBar(0, 0, w, "Raw Radar");
        
        if (activeSensor === "radar") {
          p.stroke(0);
          p.strokeWeight(6);
          p.noFill();
          p.rect(3, 3, w - 6, radarHeight - 6);
        }
        
        p.noStroke(); p.textAlign(p.LEFT, p.TOP);
        const rItems = [
          ["X:", targetX.toFixed(1)], ["Y:", targetY.toFixed(1)],
          ["Speed:", speed.toFixed(1)], ["Acceleration:", acceleration.toFixed(1)],
          ["Points:", String(positionTrail.length)], ["Zone:", currentZone + " (" + currentDistanceCM.toFixed(0) + "cm)"]
        ];
        // 2 columns x 3 rows, sized to fit inside the info column and section height
        const rColW = (infoBoxW - 32) / 2;
        const rRowH = Math.min(70, (radarHeight - BAR - 20) / 3);
        for (let i = 0; i < rItems.length; i++) {
          const cx2 = 20 + (i % 2) * rColW;
          const ry = BAR + 10 + Math.floor(i / 2) * rRowH;
          p.fill(0, 0, 0, 150); p.textFont('JetBrains Mono'); p.textStyle(p.NORMAL);
          fitTextSize(rItems[i][0], rColW - 10, 13);
          p.text(rItems[i][0], cx2, ry);
          p.fill(0); p.textFont('Helvetica'); p.textStyle(p.BOLD);
          fitTextSize(rItems[i][1], rColW - 10, Math.min(26, rRowH - 24));
          p.text(rItems[i][1], cx2, ry + 17);
        }
        p.textStyle(p.NORMAL);
        p.stroke(0); p.strokeWeight(3); p.line(infoBoxW, BAR, infoBoxW, radarHeight); p.noStroke();
        
        const radarVisX = infoBoxW + 20;
        const radarVisW = w - infoBoxW - 20;
        
        p.noFill();
        
        const radarCenterX = radarVisX + radarVisW / 2;
        const radarCenterY = radarHeight - 16;
        const radarRadius = Math.min((radarHeight - BAR) * 0.85, radarVisW * 0.36);
        
        p.push();
        p.translate(radarCenterX, radarCenterY);
        p.stroke(0, 0, 0, 90); p.noFill(); p.strokeWeight(2);
        for(let r=radarRadius/4;r<=radarRadius;r+=radarRadius/4) 
          p.arc(0,0,r*2,r*2,p.PI,p.TWO_PI);
        p.stroke(0); p.strokeWeight(2);
        p.line(-radarRadius, 0, radarRadius, 0);
        
       
        const maxMM=1500.0;
        if (radarTrail.length > 0) {
          for(let i=0;i<radarTrail.length;i++){
            const pos=radarTrail[i];
            const opacity=p.map(i,0,radarTrail.length-1,60,200);
            const clampedX=p.constrain(pos.x,-maxMM,maxMM);
            const clampedY=p.constrain(pos.y,0,maxMM);
            const scaledX=p.map(clampedX,-maxMM,maxMM,radarRadius,-radarRadius); // mirrored
            const scaledY=p.map(clampedY,0,maxMM,0,-radarRadius);
            p.fill(0, 0, 0, opacity); p.noStroke();
            const sz = p.map(i, 0, radarTrail.length-1, 6, 14);
            p.ellipse(scaledX,scaledY,sz,sz);
          }
        }
        
        // walking trail
        for(let i=0;i<displayTrail.length;i++){
          const pos=displayTrail[i];
          const opacity=p.map(i,0,displayTrail.length,100,220);
          const clampedX=p.constrain(pos.x,-maxMM,maxMM);
          const clampedY=p.constrain(pos.y,0,maxMM);
          const scaledX=p.map(clampedX,-maxMM,maxMM,radarRadius,-radarRadius); // mirrored
          const scaledY=p.map(clampedY,0,maxMM,0,-radarRadius);
          p.fill(0,0,0,opacity); p.noStroke();
          p.ellipse(scaledX,scaledY,12,12);
        }
        
        if(displayTrail.length>0){
          const last=displayTrail[displayTrail.length-1];
          const clampedX=p.constrain(last.x,-maxMM,maxMM);
          const clampedY=p.constrain(last.y,0,maxMM);
          const sx=p.map(clampedX,-maxMM,maxMM,radarRadius,-radarRadius); // mirrored
          const sy=p.map(clampedY,0,maxMM,0,-radarRadius);
          p.fill(0); p.noStroke();
          p.ellipse(sx,sy,24,24);
        }
        p.pop();
        
        p.pop();

        // decision tree

        p.push();
        p.fill(255, 220, 0);
        p.noStroke();
        p.rect(0, gazeHeight + radarHeight, w, decisionHeight);
        drawDecisionTree(gazeHeight + radarHeight, decisionHeight);
        p.pop();

        p.pop(); // end of scaled drawing

        // update radar data and trail
        if(window._lastRadarLine){
          const line = window._lastRadarLine; 
          window._lastRadarLine = null;
          const vals = line.split(',').map(v => parseFloat(v));
          // Skip malformed lines ("nan", empty fields, garbled serial). A single NaN
          // would otherwise poison filteredX/Y forever and freeze the position dot.
          if(vals.length>=4 && vals.slice(0,4).every(Number.isFinite)){
            targetX=vals[0];
            targetY=vals[1];
            speed=vals[2];
            acceleration=vals[3];
            const distance = Math.sqrt(targetX*targetX + targetY*targetY);
            currentZone = calculateZone(distance);
            currentDistanceCM = distance / 10;
            
                      radarTrail.push(p.createVector(targetX, targetY));
            if (radarTrail.length > RADAR_TRAIL_MAX) radarTrail.shift();
          }
        }
        
        // Self-heal: if the filter ever got a non-finite value, restart it from the current target
        if (!Number.isFinite(filteredX) || !Number.isFinite(filteredY)) {
          filteredX = targetX;
          filteredY = targetY;
        }
        filteredX = alpha*targetX + (1-alpha)*filteredX;
        filteredY = alpha*targetY + (1-alpha)*filteredY;

        let addPoint = true;
        if(positionTrail.length>0){
          const lastPos = positionTrail[positionTrail.length-1];
          const distance = p.dist(filteredX,filteredY,lastPos.x,lastPos.y);
          addPoint = distance > movementThreshold;
        }
        if(addPoint){
          positionTrail.push(p.createVector(filteredX,filteredY));
          speedTrail.push(speed||0);
          yDirectionTrail.push(filteredY);
          displayTrail.push(p.createVector(filteredX,filteredY));
          if(displayTrail.length > maxTrailLength) displayTrail.shift();
        }

        if(positionTrail.length >= maxTrailLength) analyzeBehaviorLocal();
      };
    });
  </script>
